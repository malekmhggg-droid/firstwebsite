<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade 1 Addition</title>
    <style>
       body {
    background: linear-gradient(135deg, #4a90e2, #50e3c2, #b06ab3);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

        .navbar {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 0;
            position: fixed;
            top: 0;
            left: 0;
        }

        .navbar a {
            color: white;
            margin: 0 20px;
            text-decoration: none;
            font-size: 20px;
            transition: 0.2s;
        }

        .navbar a:hover {
            color: #00c8ff;
        }

        h1 {
            margin-top: 120px;
            font-size: 45px;
            text-shadow: 0 0 10px black;
        }

        .lesson-box {
            margin: 40px auto;
            width: 60%;
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid white;
            font-size: 22px;
            line-height: 1.6;
        }

        .example {
            font-size: 30px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/">Home</a>
        <a href="/lessons">Lessons</a>
        <a href="/grade1">Grade 1</a>
        <a href="/practice">Practice</a>
    </div>

    <h1>Grade 1 – Addition</h1>

    <div class="lesson-box">
        <p>Addition means putting things together.</p>

        <div class="example">1 + 1 = 2</div>
        <div class="example">2 + 3 = 5</div>
        <div class="example">4 + 4 = 8</div>

        <p>When you add, the number gets bigger.</p>
    </div>

</body>
</html>
