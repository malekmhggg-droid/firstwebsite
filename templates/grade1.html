<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade 1 Lessons</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4a90e2, #50e3c2, #b06ab3);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            color: white;
            text-align: center;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* NAVBAR */
        .navbar {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 0;
            position: fixed;
            top: 0;
            left: 0;
        }

        .navbar a {
            color: white;
            margin: 0 20px;
            text-decoration: none;
            font-size: 20px;
            transition: 0.2s;
        }

        .navbar a:hover {
            color: #00c8ff;
        }

        /* TITLE */
        h1 {
            margin-top: 120px;
            font-size: 45px;
            text-shadow: 0 0 10px black;
        }

        /* CARDS */
        .card-container {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .card {
            width: 250px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid white;
            border-radius: 15px;
            transition: 0.25s;
            text-decoration: none;
            color: white;
            font-size: 22px;
        }

        .card:hover {
            background: white;
            color: black;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <a href="/">Home</a>
        <a href="/lessons">School Levels</a>
        <a href="/elementary">Elementary</a>
        <a href="/practice">Practice</a>
    </div>

    <h1>Grade 1 Lessons</h1>
    <p>Select a topic to begin learning.</p>

    <div class="card-container">
        <a class="card" href="/grade1/addition">
            Addition<br><small>1+1, 2+3, simple sums</small>
        </a>

        <a class="card" href="/grade1/subtraction">
            Subtraction<br><small>5−2, 7−3, simple differences</small>
        </a>

        <a class="card" href="/grade1/counting">
            Counting<br><small>Counting to 20, 50, 100</small>
        </a>

        <a class="card" href="/grade1/shapes">
            Shapes<br><small>Circle, square, triangle</small>
        </a>

        <a class="card" href="/grade1/placevalue">
            Place Value<br><small>Tens and ones</small>
        </a>
    </div>

</body>
</html>
