<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade 1 Quiz</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4a90e2, #50e3c2, #b06ab3);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            color: white;
            text-align: center;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .navbar {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 0;
            position: fixed;
            top: 0;
            left: 0;
        }

        .navbar a {
            color: white;
            margin: 0 20px;
            text-decoration: none;
            font-size: 20px;
            transition: 0.2s;
        }

        .navbar a:hover {
            color: #00c8ff;
        }

        h1 {
            margin-top: 120px;
            font-size: 45px;
            text-shadow: 0 0 10px black;
        }

        .quiz-box {
            margin: 40px auto;
            width: 60%;
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid white;
            font-size: 22px;
            line-height: 1.6;
            text-align: left;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #00eaff;
            color: black;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.1);
            background: white;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/">Home</a>
        <a href="/lessons">School Levels</a>
        <a href="/elementary">Elementary</a>
        <a href="/grade1">Grade 1</a>
    </div>

    <h1>Grade 1 Quiz</h1>

    <form action="/grade1/quiz/submit" method="POST">
        <div class="quiz-box">
            {% for q in questions %}
                <p><strong>{{ loop.index }}. {{ q.question }}</strong></p>

                {% for option in q.options %}
                    <label>
                        <input type="radio" name="q{{ loop.parent.index }}" value="{{ option }}" required>
                        {{ option }}
                    </label><br>
                {% endfor %}

                <br>
            {% endfor %}
        </div>

        <button type="submit">Submit Quiz</button>
    </form>

</body>
</html>
