<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade 1 Quiz</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4a90e2, #50e3c2, #b06ab3);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            color: white;
            text-align: center;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .quiz-box {
            margin: 140px auto;
            width: 60%;
            background: rgba(0, 0, 0, 0.75);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid white;
            font-size: 22px;
            text-align: left;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #00eaff;
            color: black;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.1);
            background: white;
        }
    </style>
</head>
<body>

    <h1 style="margin-top:120px;">Grade 1 Quiz</h1>

    <form action="/grade1/quiz/submit" method="POST">

        <!-- Hidden field to store the EXACT questions used -->
        <input type="hidden" name="questions_json" value='{{ questions | tojson }}'>

        <div class="quiz-box">
            {% for q in questions %}
                <p><strong>{{ loop.index }}. {{ q.question }}</strong></p>

                {% for option in q.options %}
                    <label>
                        <input type="radio" name="q{{ loop.index }}" value="{{ option }}" required>
                        {{ option }}
                    </label><br>
                {% endfor %}

                <br>
            {% endfor %}
        </div>

        <button type="submit">Submit Quiz</button>
    </form>

</body>
</html>
