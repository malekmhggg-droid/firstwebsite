<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Results</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4a90e2, #50e3c2, #b06ab3);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            color: white;
            text-align: center;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .result-box {
            margin: 150px auto;
            width: 50%;
            background: rgba(0, 0, 0, 0.75);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid white;
            font-size: 26px;
        }

        .pass {
            color: #00ff9d;
            font-weight: bold;
        }

        .fail {
            color: #ff4d4d;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: white;
            color: black;
            border-radius: 10px;
            text-decoration: none;
            font-size: 20px;
            transition: 0.2s;
        }

        a:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="result-box">
        <h1>Your Score: {{ score }}/10</h1>
        <h2>Grade: {{ grade }}</h2>

        {% if passed %}
            <p class="pass">You Passed! Great job!</p>
        {% else %}
            <p class="fail">You Failed. Try again!</p>
        {% endif %}

        <a href="/grade1/quiz">Try Again</a>
        <a href="/grade1">Back to Grade 1</a>
    </div>

</body>
</html>
