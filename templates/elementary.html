<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elementary School</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4a90e2, #50e3c2, #b06ab3);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            color: white;
            text-align: center;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* NAVBAR */
        .navbar {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 0;
            position: fixed;
            top: 0;
            left: 0;
        }

        .navbar a {
            color: white;
            margin: 0 20px;
            text-decoration: none;
            font-size: 20px;
            transition: 0.2s;
        }

        .navbar a:hover {
            color: #00c8ff;
        }

        /* TITLE */
        h1 {
            margin-top: 120px;
            font-size: 45px;
            text-shadow: 0 0 10px black;
        }

        /* GRADE CARDS */
        .card-container {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .card {
            width: 250px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid white;
            border-radius: 15px;
            transition: 0.25s;
            text-decoration: none;
            color: white;
            font-size: 24px;
        }

        .card:hover {
            background: white;
            color: black;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <a href="/">Home</a>
        <a href="/lessons">School Levels</a>
        <a href="/practice">Practice</a>
        <a href="/categories">Categories</a>
    </div>

    <h1>Elementary School</h1>
    <p>Select a grade to begin learning.</p>

    <div class="card-container">
        <a class="card" href="/grade1">Grade 1</a>
        <a class="card" href="/grade2">Grade 2</a>
        <a class="card" href="/grade3">Grade 3</a>
        <a class="card" href="/grade4">Grade 4</a>
        <a class="card" href="/grade5">Grade 5</a>
        <a class="card" href="/grade6">Grade 6</a>
    </div>

</body>
</html>
