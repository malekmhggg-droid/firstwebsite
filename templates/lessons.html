<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lessons</title>
    <style>
        body {
    background: linear-gradient(135deg, #4a90e2, #50e3c2, #b06ab3);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

        /* NAVBAR */
        .navbar {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 0;
            position: fixed;
            top: 0;
            left: 0;
        }

        .navbar a {
            color: white;
            margin: 0 20px;
            text-decoration: none;
            font-size: 20px;
            transition: 0.2s;
        }

        .navbar a:hover {
            color: #00c8ff;
        }

        h1 {
            margin-top: 120px;
            font-size: 45px;
            text-shadow: 0 0 10px black;
        }

        /* LESSON CARDS */
        .card-container {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .card {
            width: 250px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid white;
            border-radius: 15px;
            transition: 0.25s;
            text-decoration: none;
            color: white;
        }

        .card:hover {
            background: white;
            color: black;
            transform: scale(1.1);
        }

        .card h2 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <a href="/">Home</a>
        <a href="/lessons">Lessons</a>
        <a href="/practice">Practice</a>
        <a href="/categories">Categories</a>
    </div>

    <h1>Math Lessons</h1>
    <p>Select a topic to begin learning.</p>

    <div class="card-container">
        <a class="card" href="/lessons/algebra">
            <h2>Algebra</h2>
            <p>Variables, equations, expressions</p>
        </a>

        <a class="card" href="/lessons/fractions">
            <h2>Fractions</h2>
            <p>Adding, subtracting, multiplying</p>
        </a>

        <a class="card" href="/lessons/geometry">
            <h2>Geometry</h2>
            <p>Shapes, angles, area</p>
        </a>

        <a class="card" href="/lessons/integers">
            <h2>Integers</h2>
            <p>Positive & negative numbers</p>
        </a>

        <a class="card" href="/lessons/decimals">
            <h2>Decimals</h2>
            <p>Place value, operations</p>
        </a>
    </div>

</body>
</html>
