<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade 1 – Place Value</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4a90e2, #50e3c2, #b06ab3);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            color: white;
            text-align: center;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .lesson-box {
            margin: 140px auto;
            width: 60%;
            background: rgba(0, 0, 0, 0.75);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid white;
            font-size: 22px;
        }

        .example {
            font-size: 32px;
            margin: 20px 0;
        }

        .highlight {
            color: #00eaff;
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: white;
            color: black;
            border-radius: 10px;
            text-decoration: none;
            font-size: 20px;
        }

        .back-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="lesson-box">
        <h1>Grade 1 – Place Value</h1>

        <p>Place value tells us what each digit in a number means.</p>

        <div class="example">
            <span class="highlight">12</span> = 1 ten and 2 ones
        </div>

        <div class="example">
            <span class="highlight">35</span> = 3 tens and 5 ones
        </div>

        <div class="example">
            <span class="highlight">48</span> = 4 tens and 8 ones
        </div>

        <p>Tens are groups of 10. Ones are single units.</p>

        <a class="back-btn" href="/grade1">⬅ Back to Grade 1</a>
    </div>

</body>
</html>
