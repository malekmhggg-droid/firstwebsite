<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade 1 – Counting</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4a90e2, #50e3c2, #b06ab3);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            color: white;
            text-align: center;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .lesson-box {
            margin: 140px auto;
            width: 60%;
            background: rgba(0, 0, 0, 0.75);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid white;
            font-size: 22px;
        }

        .example {
            font-size: 32px;
            margin: 15px 0;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: white;
            color: black;
            border-radius: 10px;
            text-decoration: none;
            font-size: 20px;
        }

        .back-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="lesson-box">
        <h1>Grade 1 – Counting</h1>

        <p>Counting means saying numbers in order.</p>

        <div class="example">1, 2, 3, 4, 5</div>
        <div class="example">6, 7, 8, 9, 10</div>
        <div class="example">11, 12, 13, 14, 15</div>

        <p>You can count objects, fingers, toys, or anything around you.</p>

        <div class="example">🍎 🍎 🍎 = 3 apples</div>
        <div class="example">⭐ ⭐ ⭐ ⭐ ⭐ = 5 stars</div>

        <a class="back-btn" href="/grade1">⬅ Back to Grade 1</a>
    </div>

</body>
</html>
